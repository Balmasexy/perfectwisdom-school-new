name: Perfect Wisdom School Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: apps/web
        run: pnpm build

      - name: Sync Capacitor Android
        working-directory: apps/web
        run: pnpm exec cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build Debug APK
        working-directory: apps/web/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build Release APK
        working-directory: apps/web/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Build Release AAB
        working-directory: apps/web/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: perfect-wisdom-school-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: perfect-wisdom-school-release-apk-unsigned
          path: apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: perfect-wisdom-school-release-aab-unsigned
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
